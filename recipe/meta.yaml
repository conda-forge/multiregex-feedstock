{% set name = "multiregex" %}
{% set version = "2.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/multiregex-{{ version }}.tar.gz
  sha256: 2d79c21660973acfe4cc8ef4dd18e44a863ae617c8e9c3ca431a2941fe5afb6b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools_scm
    - setuptools
  run:
    - pyahocorasick
    - python >={{ python_min }}

test:
  imports:
    - multiregex
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Quantco/multiregex
  summary: Speed up regex matching with non-regex substring "prematchers", similar to Bloom filters.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - '0xbe7a'
    - ivergara
    - jonashaag
